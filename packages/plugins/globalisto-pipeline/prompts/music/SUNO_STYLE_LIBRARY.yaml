version: suno_v5_documentary_v4
description: >
  Expanded canonical Suno v5 style library.
  ENGLISH-FIRST naming for optimal Suno parsing.
  Now includes Korean, Southeast Asian, and pan-Asian lanes.
  Separate style and exclusions fields (Suno v5 format).
  Atomic, read-only, Suno-native style blocks.

# ════════════════════════════════════════════════════════════════
# EMOTION TOKEN REFERENCE (used by Phase 12C)
# ════════════════════════════════════════════════════════════════
#
# | Function         | Primary    | Alt 1        | Alt 2      | Alt 3     |
# |------------------|------------|--------------|------------|-----------|
# | ORIENT           | watchful   | alert        | anticipatory | poised  |
# | EXPLAIN          | steady     | measured     | clear      | focused   |
# | INVESTIGATE      | uneasy     | probing      | tense      | searching |
# | TRANSITION       | suspended  | drifting     | liminal    | passing   |
# | CONSEQUENCE      | grave      | weighty      | sober      | heavy     |
# | UNRESOLVED_CLOSE | lingering  | unsettled    | suspended  | open      |
#
# ════════════════════════════════════════════════════════════════

lanes:

  # ══════════════════════════════════════════════════════════════
  # CHINESE-DERIVED CHARACTER LANES
  # ══════════════════════════════════════════════════════════════

  C1_CHINESE_HIPHOP_FUSION:
    suno_name: "Chinese hip-hop fusion"
    style: >
      Chinese hip-hop fusion, {EMOTION} tone, mid-tempo 75-90 BPM,
      steady hip-hop groove with clear downbeat and restrained swing,
      melodic pentatonic phrasing, plucked traditional instruments layered with piano,
      light sustained strings, clean pop-hip-hop structure with controlled dynamics
      and minimal ornamentation.
    excludes: >
      aggressive trap drums, distorted bass, EDM drops, rock guitars,
      cinematic trailer scoring, free-tempo rubato, heavy reverb washes,
      experimental jazz harmony.
    function_fit:
      ORIENT: excellent
      EXPLAIN: poor
      INVESTIGATE: good
      TRANSITION: possible
      CONSEQUENCE: possible
      UNRESOLVED_CLOSE: poor

  C4_GUOCHAO:
    suno_name: "Guochao electronic"
    style: >
      Guochao electronic, {EMOTION} tone, mid-tempo 95-115 BPM,
      rhythm-first structure with strong pulse,
      modern electronic beats fused with short traditional Chinese motifs,
      punchy articulation, concise melodic phrases,
      tight contemporary production.
    excludes: >
      romantic orchestral scoring, long legato string passages,
      slow ballad pacing, vintage lo-fi textures,
      jazz swing, Western folk or rock aesthetics.
    function_fit:
      ORIENT: excellent
      EXPLAIN: poor
      INVESTIGATE: good
      TRANSITION: possible
      CONSEQUENCE: poor
      UNRESOLVED_CLOSE: poor

  C5_GUFENG:
    suno_name: "Gufeng ambient"
    style: >
      Gufeng ambient, {EMOTION} tone, slow to mid-tempo 60-85 BPM,
      free-flowing rhythmic pacing, airy textures,
      traditional Chinese instruments with sustained lyrical phrasing,
      spacious fantasy-oriented ambience and minimal rhythmic density.
    excludes: >
      hip-hop beats, trap rhythms, pop song structures,
      EDM energy, funk grooves, heavy percussion,
      cinematic trailer effects.
    function_fit:
      ORIENT: excellent
      EXPLAIN: good
      INVESTIGATE: excellent
      TRANSITION: excellent
      CONSEQUENCE: excellent
      UNRESOLVED_CLOSE: excellent

  C6_MODERN_CINEMATIC_CHINESE:
    suno_name: "Modern cinematic Chinese"
    style: >
      Modern cinematic Chinese, {EMOTION} tone, slow to mid-tempo 65-85 BPM,
