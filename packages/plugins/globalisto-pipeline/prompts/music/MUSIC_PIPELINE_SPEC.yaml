# =============================================================================
# 10. EMOTION TOKEN ROTATION TABLES
# =============================================================================

EMOTION_TOKEN_ROTATION:
  function_emotion_mapping:
    ORIENT:
      primary: "watchful"
      alternates: ["alert", "anticipatory", "poised"]
    EXPLAIN:
      primary: "steady"
      alternates: ["measured", "clear", "focused"]
    INVESTIGATE:
      primary: "uneasy"
      alternates: ["probing", "tense", "searching"]
    TRANSITION:
      primary: "suspended"
      alternates: ["drifting", "liminal", "passing"]
    CONSEQUENCE:
      primary: "grave"
      alternates: ["weighty", "sober", "heavy"]
    UNRESOLVED_CLOSE:
      primary: "lingering"
      alternates: ["unsettled", "suspended", "open"]
  
  rotation_logic: |
    - Use PRIMARY for FIRST occurrence of each function
    - Use ALTERNATES (in order) for subsequent occurrences of SAME function
    - Cycle back to PRIMARY after exhausting alternates
    - Example: INVESTIGATE (1st) → "uneasy", INVESTIGATE (2nd) → "probing", INVESTIGATE (3rd) → "tense", INVESTIGATE (4th) → "searching", INVESTIGATE (5th) → "uneasy"

