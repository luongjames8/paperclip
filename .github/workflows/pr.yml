name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Fork (luongjames8/paperclip): run this branch's own pr-trusted.yml, not
    # upstream master's, so fork-only CI carries (lockfile exemption below)
    # apply. The fork has no AWS runner group; the gate already falls back to
    # GitHub-hosted runners off paperclipai/paperclip.
    uses: ./.github/workflows/pr-trusted.yml
